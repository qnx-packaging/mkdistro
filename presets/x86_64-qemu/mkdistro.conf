#!/usr/bin/env bash
# shellcheck disable=SC2034

arch="x86_64" # Genereated image arch can be x86_64 or aarch64

boot_partition_type="efi" # sets the GPT partition type, efi has a built-in layout
#boot_partition_layout="rpi5" # loads <type>.build for the contents of the boot partititon

boot_partition_size="256M" # Size in G M T format

image_size="200G"    # Size in G M T format
image_format="qcow2" # raw, qcow2
image_inodes="auto"  # sets the rootfs inode number `auto` uses qnx6fs base algorithm,  <number> hard coded the amount

# Network availabe apk repositories used to download packages
repositories=(
  "https://repo.oss.qnx.com/8.0.3/core"
  "https://repo.oss.qnx.com/8.0.3/extra"
  "https://repo.oss.qnx.com/8.0.5/core"
  "https://repo.oss.qnx.com/8.0.5/extra"
)

# apk repositories that are local to the machine can optionally be vendored into the image via
# <dest>::<orign> format
local_repositories=(
  "/var/local/mkdistro/qsc-apk/qnx-core::${HOME}/.cache/qsc-apk/8.0.5/qnx-core"
  "/var/local/mkdistro/qsc-apk/qnx-extra::${HOME}/.cache/qsc-apk/8.0.5/qnx-extra"
)

# signing keys for apk packages can be fetch via https / file / or locally setup abuild keys
keys=(
  "https://repo.oss.qnx.com/keys/qnxosd.rsa.pub"
  "abuild://default"
)

# Base set of packages to be installed into the image based on repositories & local_repositories above
packages=(
  # System Base & Core Utilities
  filesystem apk-tools bash bash-completion sed grep
  gzip bzip2 xz tar sudo nano ncurses-terminfo
  python3 openrc

  # QNX Core & System Services
  qnx-base qnx-os-services qnx-slogger2 qnx-utils
  qnx-fs-notify qnx-fs-core qnx-fs-qnx6

  # QNX Drivers & Virtualization
  qnx-random qnx-random-virtio qnx-devc-virtio
  qnx-devb-virtio qnx-devb-ram

  # QNX Hardware & PCI
  qnx-libpci qnx-libqh qnx-pci-server qnx-pci-compat
  qnx-pci-hw-intel qnx-pci-strings qnx-pci-debug

  # Networking & Connectivity
  qnx-io-sock qnx-io-sock-pci qnx-io-sock-virtio
  qnx-netutils dhcpcd openresolv openssh

  # Security, Crypto & Certificates
  qnx-security qnx-crypto qnx-crypto-openssl3
  ca-certificates ca-certificates-mozilla
)

# base set of users to be put on the system.
# NOTE: you must include users that are needed by packages this is a limitation of not being able to run qnx binaries on linux
users=(
  "root::0:0:root:/var/home/root:/bin/bash"
  "sshd:x:15:15:sshd:/var/chroot/sshd:/bin/false"
  "qnx:everywhere:1000:1000::/var/home/qnx:/bin/bash"
)

# Base set of groups to be put on the system
# # NOTE: you must include groups that are needed by packages this is a limitation of not being able to run qnx binaries on linux
groups=(
  "root:x:0:root"
  "wheel::20:qnx"
  "sshd::15:sshd"
  "qnx:x:1000:qnx"
)

# openrc services that are enabled
# NOTE: you do not need to enable everything apk will determine dependancies
openrc_services=("random" "io-sock" "dhcpcd" "apk-first-boot")

# Configure openrc conf.d/<service> files
openrc_confd["io-sock"]='
# io-sock config for virtio network adapters
io_sock_args="-m phy -m pci -d vtnet_pci"
'
# Set file/folder permissions for files that are copied by the overlay
file_permissions=(
  ["/etc/init.d/apk-first-boot"]="0:0:775"
)
