# Set the location of the IPL in memory
startup_addr="32m"
# Set the mkifs boot script attributes
startup_args="virtual=x86_64,uefi -compress"
# Set the startup and its arguments
startup_cmd="startup-x86 -D8250..115200 -zz"

# What hooks to run and in what oreder
hooks="rtc slogger2 fsevmgr pci devb-virtio rootfs devc-ser8250 devc-pty late-init"

# configuration for hooks in format of hook_<hook>_*
# see hooks mkdyifs for what they expect
hook_pci_hw_module="pci_hw-Intel_x86.so"
hook_pci_hw_config="
[interrupts]
B0:D17:F0    A    18
B0:D17:F0    B    19
B0:D17:F0    C    16
B0:D17:F0    D    17
B3:D0:F0     A    18
B3:D0:F0     B    19
B3:D0:F0     C    16
B3:D0:F0     D    17
"
hook_pci_sever_config="
[buscfg]
DO_BUS_CONFIG=no
"
hook_rtc_params="hw"
hook_devb_params=""
hook_devc_params="-e"
hook_late_init_random_params="-l devr-virtio.so -vvvv"
hook_late_init_io_sock_params="-m phy -m pci -d vtnet_pci"
devc_console_path="/dev/ser1"
init="/ifs/init/late_init"
